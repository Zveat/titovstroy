name: Уведомления в Telegram

# Смотрит журнал изменений и считает просрочки, шлёт сотрудникам в Telegram.
# Ничего не пишет в боевые данные: только два своих узла (titovstroy-tg-links и
# titovstroy-tg-state), это проверяется в коде и падает с ошибкой при попытке
# записать куда-то ещё.
#
# Каждые 15 минут. События приходят с задержкой до четверти часа — для стройки
# это мгновенно, а лишних запусков не жжём. Ежедневная сводка по просрочкам
# уходит один раз, после часа, заданного в Админке (по умолчанию 9 утра).
# Минуты смещены от круглых: на них GitHub чаще задерживает cron.
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  # ЗАПАСНОЙ ХОД, И НА ДЕЛЕ ОСНОВНОЙ. Расписание выше GitHub почти не исполняет:
  # в нём 96 тиков в сутки, а по факту прогонов выходило пять-шесть — между
  # соседними по 4-5 часов. События при этом не терялись (курсор по времени
  # лежит в titovstroy-tg-state), но приходили с опозданием на полдня, и со
  # стороны это выглядело как «уведомления не работают».
  # Парсер мастеров запускается стабильно раз в полчаса, поэтому цепляемся к
  # нему: закончился его прогон — проверяем события. Своей работы он сюда не
  # приносит, нужен только сам факт «полчаса прошло».
  # Двойной отправки быть не может: concurrency ниже выстраивает заходы в
  # очередь, а курсор не даёт отправить одно и то же дважды.
  workflow_run:
    workflows: ["Парсеры мастеров (naimi + OLX)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Сухой прогон: посчитать и показать в логе, НИЧЕГО не отправлять"
        type: boolean
        default: false
      force_digest:
        description: "Собрать сводку по просрочкам прямо сейчас, не дожидаясь утра"
        type: boolean
        default: false
      webhook:
        description: "Мгновенные ответы бота: проверить состояние / включить / выключить"
        type: choice
        default: "не трогать"
        options: ["не трогать", "проверить", "включить", "выключить"]

concurrency:
  group: telegram-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: titovstroy/notify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      # Управление webhook'ом — отдельным заходом: токен бота уже здесь, в
      # секретах, и владельцу не приходится вставлять его в браузер.
      - name: Мгновенные ответы бота
        if: ${{ inputs.webhook && inputs.webhook != 'не трогать' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_ACTION: ${{ inputs.webhook }}
        run: node webhook.mjs

      - name: Отправка
        if: ${{ !inputs.webhook || inputs.webhook == 'не трогать' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_DIGEST: ${{ inputs.force_digest && '1' || '' }}
        run: node send.mjs
