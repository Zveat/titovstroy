name: Уведомления в Telegram

# Смотрит журнал изменений и считает просрочки, шлёт сотрудникам в Telegram.
# Ничего не пишет в боевые данные: только два своих узла (titovstroy-tg-links и
# titovstroy-tg-state), это проверяется в коде и падает с ошибкой при попытке
# записать куда-то ещё.
#
# ЭТОТ ПРОГОН — ЗАПАСНОЙ ПУТЬ. ОСНОВНОЙ ЖИВЁТ НА VERCEL.
#
# Рассылку отправляет api/notify-run.mjs: serverless-функция читает базу
# сервисным ключом и шлёт в Telegram сама, за секунду-две. Приложение зовёт её
# в момент, когда пишет событие в журнал, и при нажатии «Отправить сейчас»;
# сводку дня приносит расписание, которое бьёт в тот же адрес.
#
# ПОЧЕМУ НЕ ЗДЕСЬ. Любой прогон Actions — это выдать машину, выкачать
# репозиторий, поставить зависимости: минута в лучшем случае. Владелец просил
# уведомление «в ту же секунду», и из прогона этого не выжать в принципе.
# А расписание Actions вдобавок исполняется «по возможности»: 14 сентября из 96
# запрошенных тиков случилось ТРИ (06:31, 12:00 и 18:54 по Астане). Стоявшая
# здесь подстраховка workflow_run на парсер мастеров не сработала НИ РАЗУ —
# ноль прогонов с этим событием за всё время жизни воркфлоу. Не возвращать.
#
# ЗАЧЕМ ОСТАВЛЕН. Во-первых, если Vercel недоступен — уведомления не пропадут
# совсем (курсор по времени лежит в titovstroy-tg-state, ничего не теряется).
# Во-вторых, здесь живёт опрос команд бота для случая, когда webhook выключен,
# и управление самим webhook. Раз в час этого достаточно.
#
# Двойной отправки не будет: concurrency ниже выстраивает заходы в очередь, а
# курсор и отметки отправленного не дают отправить одно и то же дважды.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Сухой прогон: посчитать и показать в логе, НИЧЕГО не отправлять"
        type: boolean
        default: false
      force_digest:
        description: "Собрать сводку по просрочкам прямо сейчас, не дожидаясь утра"
        type: boolean
        default: false
      webhook:
        description: "Мгновенные ответы бота: проверить состояние / включить / выключить"
        type: choice
        default: "не трогать"
        options: ["не трогать", "проверить", "включить", "выключить"]

concurrency:
  group: telegram-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: titovstroy/notify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      # Управление webhook'ом — отдельным заходом: токен бота уже здесь, в
      # секретах, и владельцу не приходится вставлять его в браузер.
      - name: Мгновенные ответы бота
        if: ${{ inputs.webhook && inputs.webhook != 'не трогать' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_ACTION: ${{ inputs.webhook }}
        run: node webhook.mjs

      - name: Отправка
        if: ${{ !inputs.webhook || inputs.webhook == 'не трогать' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_DIGEST: ${{ inputs.force_digest && '1' || '' }}
        run: node send.mjs
