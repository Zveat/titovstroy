name: Уведомления в Telegram

# Смотрит журнал изменений и считает просрочки, шлёт сотрудникам в Telegram.
# Ничего не пишет в боевые данные: только два своих узла (titovstroy-tg-links и
# titovstroy-tg-state), это проверяется в коде и падает с ошибкой при попытке
# записать куда-то ещё.
#
# ТРИ ВХОДА, И ГЛАВНЫЙ ИЗ НИХ — НЕ РАСПИСАНИЕ.
#
# 1. ПО СОБЫТИЮ, СРАЗУ. Приложение, дописав в журнал строку, ради которой шлют
#    уведомление, само просит запуск (src/notify/instantNotify.js → Vercel
#    api/trigger-notify.js → workflow_dispatch сюда). Сообщение уходит примерно
#    через минуту после действия, а не «когда-нибудь».
# 2. РАЗ В ПОЛЧАСА, ГАРАНТИРОВАННО. Подстраховка на случай, когда толчок из
#    браузера не дошёл (закрыли вкладку, пропала сеть, лежит Vercel), и
#    единственный путь для напоминаний и сводок — их никто не «делает» руками.
#    Нас вызывает парсер мастеров: его дёргает внешний крон каждые 30 минут, и
#    он ходит без пропусков. Он не приносит сюда своей работы — нужен только
#    факт «полчаса прошло».
#
#    РАНЬШЕ ЗДЕСЬ СТОЯЛ workflow_run НА ТОТ ЖЕ ПАРСЕР, И ОН НЕ СРАБОТАЛ НИ РАЗУ:
#    на 14 сентября у воркфлоу ноль прогонов с событием workflow_run за всё
#    время жизни, при том что парсер отработал 3597 раз. Подстраховка, названная
#    в старом комментарии «на деле основной», существовала только на бумаге.
#    workflow_call вызывается как обычная job внутри чужого прогона — тут нечему
#    «не сработать»: не запустится он только вместе с самим парсером.
# 3. РАСПИСАНИЕ НИЖЕ — третья линия, и доверия ей нет. GitHub исполняет крон «по
#    возможности»: 14 сентября из 96 запрошенных тиков случилось ТРИ (06:31,
#    12:00, 18:54 по Астане). События при этом не терялись — курсор по времени
#    лежит в titovstroy-tg-state, — но ждали часами. Просить чаще раза в час
#    больше незачем: частоту теперь держит пульс, а каждый лишний исполненный
#    тик — это ещё одно чтение базы впустую.
#
# Двойной отправки от трёх входов быть не может: concurrency ниже выстраивает
# заходы в очередь, а курсор не даёт отправить одно и то же дважды.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Сухой прогон: посчитать и показать в логе, НИЧЕГО не отправлять"
        type: boolean
        default: false
      force_digest:
        description: "Собрать сводку по просрочкам прямо сейчас, не дожидаясь утра"
        type: boolean
        default: false
      webhook:
        description: "Мгновенные ответы бота: проверить состояние / включить / выключить"
        type: choice
        default: "не трогать"
        options: ["не трогать", "проверить", "включить", "выключить"]

concurrency:
  group: telegram-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: titovstroy/notify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      # Управление webhook'ом — отдельным заходом: токен бота уже здесь, в
      # секретах, и владельцу не приходится вставлять его в браузер.
      - name: Мгновенные ответы бота
        if: ${{ inputs.webhook && inputs.webhook != 'не трогать' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_ACTION: ${{ inputs.webhook }}
        run: node webhook.mjs

      - name: Отправка
        if: ${{ !inputs.webhook || inputs.webhook == 'не трогать' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_DIGEST: ${{ inputs.force_digest && '1' || '' }}
        run: node send.mjs
