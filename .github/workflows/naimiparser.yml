name: Парсер мастеров naimi.kz

# Крутится часто, но РЕАЛЬНО парсит только когда настройки в CRM (раздел «Мастера»)
# это разрешают: по расписанию (частота) или по кнопке «Обновить сейчас». Пустой
# прогон стоит ~минуту — Actions-минуты почти не тратятся.
on:
  schedule:
    - cron: "0 */2 * * *"   # каждые 2 часа проверяет настройки; парсит по частоте/кнопке
  workflow_dispatch:          # ручной запуск с GitHub (всегда парсит, для теста)
    inputs:
      cities:
        description: "Города (слаги через запятую)"
        default: "almaty"
      category_ids:
        description: "ID категорий каталога. 47 = Ремонт"
        default: "47"
      max_services:
        description: "Максимум услуг на категорию (для теста)"
        default: "999"
      phones_per_run:
        description: "Сколько телефонов за прогон"
        default: "25"

concurrency:
  group: naimi-parser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: titovstroy/naimi-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      # Читает настройки из базы (частота, «Обновить сейчас», города, телефоны)
      # и решает should_run. Тяжёлые шаги ниже — только если should_run=true.
      - name: Проверка настроек
        id: cfg
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          EVENT_NAME: ${{ github.event_name }}
          CITIES: ${{ github.event.inputs.cities }}
          CATEGORY_IDS: ${{ github.event.inputs.category_ids }}
          PHONES_PER_RUN: ${{ github.event.inputs.phones_per_run }}
        run: node check.mjs

      - name: Установка Chromium
        if: steps.cfg.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Запуск парсера
        if: steps.cfg.outputs.should_run == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          MASTERS_KEY: ${{ vars.MASTERS_KEY }}
          CITIES: ${{ github.event.inputs.cities || steps.cfg.outputs.cities }}
          CATEGORY_IDS: ${{ github.event.inputs.category_ids || steps.cfg.outputs.category_ids }}
          MAX_SERVICES_PER_CAT: ${{ github.event.inputs.max_services || '999' }}
          MAX_PAGES: ${{ vars.MAX_PAGES || '6' }}
          FETCH_PHONES: ${{ vars.FETCH_PHONES || '1' }}
          PHONES_PER_RUN: ${{ github.event.inputs.phones_per_run || steps.cfg.outputs.phones_per_run }}
          PHONE_DELAY_MIN_MS: ${{ vars.PHONE_DELAY_MIN_MS || '4000' }}
          PHONE_DELAY_MAX_MS: ${{ vars.PHONE_DELAY_MAX_MS || '11000' }}
          RUN_NOW: ${{ steps.cfg.outputs.run_now }}
        run: npm run scrape
