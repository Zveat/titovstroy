name: Парсер мастеров naimi.kz

# Список мастеров берётся напрямую с JSON-API naimi (без браузера — быстро).
# Крутится каждые 2 часа, но scrape.mjs сам читает настройки из CRM (раздел «Мастера»,
# ключ базы titovstroy-masters-config) и парсит только когда пора: по частоте или по
# кнопке «Обновить сейчас». Не пора — прогон завершается за секунды.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:          # ручной запуск с GitHub — парсит всегда (для теста)
    inputs:
      cities:
        description: "Города (слаги через запятую). Пусто = взять из настроек CRM"
        default: ""
      category_ids:
        description: "ID категорий (через запятую). Пусто = из настроек CRM. 47=Ремонт"
        default: ""
      phones_per_run:
        description: "Телефонов за прогон. Пусто = из настроек CRM"
        default: ""

concurrency:
  group: naimi-parser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: titovstroy/naimi-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Запуск парсера
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NAIMI_SESSION: ${{ secrets.NAIMI_SESSION }}   # для телефонов (опц.)
          NAIMI_USER: ${{ secrets.NAIMI_USER }}         # для телефонов (опц.)
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          MASTERS_KEY: ${{ vars.MASTERS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          CITIES: ${{ github.event.inputs.cities }}
          CATEGORY_IDS: ${{ github.event.inputs.category_ids }}
          PHONES_PER_RUN: ${{ github.event.inputs.phones_per_run }}
        run: npm run scrape
