name: Парсеры мастеров (naimi + OLX)

# Два источника: naimi.kz (scrape.mjs) и OLX.kz (scrape-olx.mjs), каждый со своими
# настройками в CRM (ключи titovstroy-masters-config и titovstroy-masters-olx-config)
# и своим ключом базы. Оба берут данные напрямую с JSON-API (без браузера).
# Резервная проверка РАЗ В ЧАС: основной запуск по кнопке идёт через защищённый
# Vercel API. Минуты смещены от круглых значений, где GitHub чаще задерживает cron.
# Репозиторий публичный → минуты Actions бесплатны.
#
# ПОЧЕМУ НЕ КАЖДЫЕ 10 МИНУТ, КАК БЫЛО. Смысла в них не было: GitHub исполняет крон
# по возможности, и из запрошенных 144 тиков в сутки реально запускалось 6-8. Ту же
# резервную роль раз в час выполняет честнее, а счёт прогонов от этого не изменился —
# 48 из ~54 в сутки приходят снаружи, воркфлоу дёргает по dispatch внешний крон
# каждые 30 минут (основной путь — кнопка в CRM через защищённый Vercel API).
#
# СКОЛЬКО ЭТО СТОИТ, РЕШАЕТСЯ НЕ ЗДЕСЬ, А В ПАРСЕРЕ. Оба парсера читают свой узел
# мастеров ЦЕЛИКОМ (вместе 16 МБ и растёт), поэтому у каждого свой зазор: заход,
# пришедший раньше срока, выходит, прочитав только настройки. Ключевое — зазор
# считается от ПОПЫТКИ, а не от успеха (parsercore.mjs, lastAttemptAt): 7 сентября
# запись OLX перестала помещаться в предел Firebase, отметка об успехе замерла, и
# каждый заход снова читал десять мегабайт, чтобы упасть на том же месте — почти
# полгигабайта в сутки за работу, которая никуда не сохранялась.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:          # ручной запуск с GitHub — парсит всегда (для теста)
    inputs:
      cities:
        description: "Города (слаги через запятую). Пусто = взять из настроек CRM"
        default: ""
      category_ids:
        description: "ID категорий (через запятую). Пусто = из настроек CRM. 47=Ремонт"
        default: ""
      phones_per_run:
        description: "naimi: телефонов за прогон. Пусто = из настроек CRM"
        default: ""
      olx_region_id:
        description: "OLX: регион (Караганда=5). Пусто = из настроек CRM"
        default: ""
      olx_category_ids:
        description: "OLX: категории (188=Ремонт и строительство). Пусто = из настроек CRM"
        default: ""
      olx_phones_per_run:
        description: "OLX: телефонов за прогон. Пусто = из настроек CRM"
        default: ""

concurrency:
  group: naimi-parser
  cancel-in-progress: false

jobs:
  naimi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: titovstroy/naimi-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Запуск парсера naimi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NAIMI_SESSION: ${{ secrets.NAIMI_SESSION }}   # для телефонов (опц.)
          NAIMI_USER: ${{ secrets.NAIMI_USER }}         # для телефонов (опц.)
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          MASTERS_KEY: ${{ vars.MASTERS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          CITIES: ${{ github.event.inputs.cities }}
          CATEGORY_IDS: ${{ github.event.inputs.category_ids }}
          PHONES_PER_RUN: ${{ github.event.inputs.phones_per_run }}
        run: npm run scrape

  olx:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: titovstroy/naimi-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Запуск парсера OLX
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          EVENT_NAME: ${{ github.event_name }}
          OLX_REGION_ID: ${{ github.event.inputs.olx_region_id }}
          OLX_CATEGORY_IDS: ${{ github.event.inputs.olx_category_ids }}
          OLX_PHONES_PER_RUN: ${{ github.event.inputs.olx_phones_per_run }}
        run: npm run scrape-olx
