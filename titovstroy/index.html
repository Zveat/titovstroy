<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Отключаем авто-распознавание чисел как телефонов в Safari/iOS (убирает зелёное подчёркивание сумм) -->
    <meta name="format-detection" content="telephone=no" />
    <title>TitovStroy — Цифровая система управления ремонтами</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23b8904a'/><text y='.9em' font-size='70' x='15' font-weight='900' fill='%230c0e1a'>T</text></svg>" />
    <link rel="apple-touch-icon" href="/appletouchicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TitovStroy" />
    <!-- Ускоряем установку соединений до того, как понадобятся данные -->
    <link rel="preconnect" href="https://titovstroy-da1cf-default-rtdb.firebaseio.com" crossorigin />
    <link rel="dns-prefetch" href="https://titovstroy-da1cf-default-rtdb.firebaseio.com" />
    <style>
      html,body,#root{margin:0;padding:0;background:#f8fafc;min-height:100vh}
      #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 70%,#283549 100%);z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition:opacity .25s ease}
      #boot-splash.hide{opacity:0;pointer-events:none}
      #boot-splash .logo{width:74px;height:74px;border-radius:18px;background:#b8904a;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;color:#0c0e1a;box-shadow:0 12px 32px rgba(0,0,0,.35)}
      #boot-splash .name{color:#f1f5f9;font-size:18px;font-weight:700;letter-spacing:.02em}
      #boot-splash .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.2);border-top-color:#b8904a;border-radius:50%;animation:bsp .7s linear infinite}
      @keyframes bsp{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="logo">T</div>
      <div class="name">TitovStroy</div>
      <div class="spin"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
