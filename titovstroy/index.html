<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Палитра приложения светлая и фиксированная. Без этой строки телефон в
         тёмной теме отдаёт системным элементам (поля даты, выпадающие списки,
         автозаполнение) тёмное оформление: поля даты выглядели серыми плашками,
         хотя фон им задан белый. -->
    <meta name="color-scheme" content="light" />
    <!-- Отключаем авто-распознавание чисел как телефонов в Safari/iOS (убирает зелёное подчёркивание сумм) -->
    <meta name="format-detection" content="telephone=no" />
    <!-- ERP не должна попадать в поиск: внутренняя система + клиентские кабинеты -->
    <meta name="robots" content="noindex, nofollow" />
    <title>TitovStroy — Цифровая система управления ремонтами</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23b8904a'/><text y='.9em' font-size='70' x='15' font-weight='900' fill='%230c0e1a'>T</text></svg>" />
    <link rel="apple-touch-icon" href="/appletouchicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TitovStroy" />
    <!-- Ускоряем установку соединений до того, как понадобятся данные -->
    <link rel="preconnect" href="https://titovstroy-da1cf-default-rtdb.firebaseio.com" crossorigin />
    <link rel="dns-prefetch" href="https://titovstroy-da1cf-default-rtdb.firebaseio.com" />
    <!-- Сервер анонимной авторизации Firebase: его ответ нужен ДО первого чтения данных,
         поэтому прогреваем TLS-соединение заранее (домен один для всех Firebase-проектов) -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <style>
      html{color-scheme:light}
      html,body,#root{margin:0;padding:0;background:#f8fafc;min-height:100vh}
      #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 70%,#283549 100%);z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition:opacity .25s ease}
      #boot-splash.hide{opacity:0;pointer-events:none}
      #boot-splash .logo{width:74px;height:74px;border-radius:18px;background:#b8904a;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;color:#0c0e1a;box-shadow:0 12px 32px rgba(0,0,0,.35)}
      #boot-splash .name{color:#f1f5f9;font-size:18px;font-weight:700;letter-spacing:.02em}
      #boot-splash .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.2);border-top-color:#b8904a;border-radius:50%;animation:bsp .7s linear infinite}
      @keyframes bsp{to{transform:rotate(360deg)}}

      /* Критичная раскладка навигации — здесь, а не в React.
         Правило «боковое меню только для десктопа» живёт в стилях приложения,
         а они появляются вместе с разметкой. На телефоне из-за этого на долю
         секунды показывались сразу два меню: десктопное и мобильное. Здесь
         оно применяется с первой отрисовки, до того как React что-то нарисует. */
      .mob-nav{display:none}
      @media(max-width:700px){ .sidebar{display:none} }

      /* Поля даты. Safari/iOS рисует input[type=date] системным оформлением:
         серая плашка, свой шрифт и свой цвет цифр — рядом с обычными полями
         это читается как «сломано». Инлайновыми стилями это не лечится: текст
         внутри поля рисуют теневые части (::-webkit-datetime-edit), до них
         дотягивается только CSS. Поэтому правило одно на всё приложение —
         и на App.jsx, и на модуль производства, — и с !important, иначе его
         перебьют инлайновые style у самих полей. */
      input[type="date"],input[type="datetime-local"],input[type="month"],input[type="time"]{
        -webkit-appearance:none!important;appearance:none!important;
        background-color:#fff!important;background-image:none!important;
        color:#0f172a!important;-webkit-text-fill-color:#0f172a!important;
        font-family:inherit;text-align:left;
      }
      input[type="date"]::-webkit-datetime-edit{padding:0;color:inherit}
      input[type="date"]::-webkit-datetime-edit-fields-wrapper{padding:0}
      input[type="date"]::-webkit-date-and-time-value{margin:0;text-align:left;color:inherit}
      input[type="date"]::-webkit-calendar-picker-indicator{opacity:.5;padding:0;margin-left:2px;cursor:pointer}
      /* Режим «только чтение» должен отличаться намеренно, а не случайно */
      input[type="date"]:disabled,input[type="datetime-local"]:disabled{
        background-color:#f8fafc!important;
        color:#94a3b8!important;-webkit-text-fill-color:#94a3b8!important;opacity:1;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="logo">T</div>
      <div class="name">TitovStroy</div>
      <div class="spin"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
