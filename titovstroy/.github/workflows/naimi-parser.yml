name: Парсер мастеров naimi.kz

on:
  schedule:
    - cron: "0 4 * * *"   # ежедневно 04:00 UTC (~10:00 Алматы). Телефоны докапываются
                          # маленькими партиями за прогон — ежедневный ритм наполняет
                          # базу быстрее, но без всплеска запросов (не блокируют).
  workflow_dispatch:        # кнопка «Run workflow» в GitHub → Actions
    inputs:
      cities:
        description: "Города (слаги через запятую)"
        default: "almaty"
      category_ids:
        description: "ID категорий каталога (через запятую). 47 = Ремонт"
        default: "47"
      max_services:
        description: "Максимум услуг на категорию (для теста)"
        default: "999"
      phones_per_run:
        description: "Сколько телефонов тянуть за прогон (тайминг против блокировок)"
        default: "25"

concurrency:
  group: naimi-parser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: naimi-parser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Установка Chromium для Playwright
        run: npx playwright install --with-deps chromium

      - name: Запуск парсера
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_DB_URL: ${{ vars.FB_DB_URL }}
          MASTERS_KEY: ${{ vars.MASTERS_KEY }}
          CITIES: ${{ github.event.inputs.cities || vars.CITIES || 'almaty' }}
          CATEGORY_IDS: ${{ github.event.inputs.category_ids || vars.CATEGORY_IDS || '47' }}
          MAX_SERVICES_PER_CAT: ${{ github.event.inputs.max_services || '999' }}
          MAX_PAGES: ${{ vars.MAX_PAGES || '6' }}
          # Тайминги докапывания телефонов (защита от блокировок)
          FETCH_PHONES: ${{ vars.FETCH_PHONES || '1' }}
          PHONES_PER_RUN: ${{ github.event.inputs.phones_per_run || vars.PHONES_PER_RUN || '25' }}
          PHONE_DELAY_MIN_MS: ${{ vars.PHONE_DELAY_MIN_MS || '4000' }}
          PHONE_DELAY_MAX_MS: ${{ vars.PHONE_DELAY_MAX_MS || '11000' }}
        run: npm run scrape
